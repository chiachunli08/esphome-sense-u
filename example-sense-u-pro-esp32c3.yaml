# Experimental Baby Pro data support. See SU602-COMPATIBILITY.md.
# Keep secrets.yaml local; do not erase flash when updating a paired device.
esphome:
  name: sense-u-pro
  friendly_name: Sense-U Pro
  min_version: 2026.10.2
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
external_components:
  - source: github://chiachunli08/esphome-sense-u@master
    components: [senseu]
    refresh: always
logger:
  level: DEBUG
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
esp32_ble_tracker:
ble_client:
  - mac_address: !secret senseu_mac_address
    id: senseu_ble
senseu:
  - id: senseu_device
    ble_client_id: senseu_ble
    pro_mode: true
    preserve_monitoring_settings: true
    # Existing flash pairing is reused. Only set this if you already know the code.
    # baby_code: !secret senseu_baby_code
    update_interval: 2s
    data_timeout: 30s
    connection_timeout: 30s
sensor:
  - platform: senseu
    id: senseu_device
    breath_rate:
      name: SenseU Breath Rate
    temperature:
      name: SenseU Temperature
    # Experimental protocol field; verify against your hardware before using.
    humidity:
      name: SenseU Humidity
    battery_level:
      name: SenseU Battery Level
    activity:
      name: SenseU Activity
    signal_strength:
      name: SenseU Device RSSI
binary_sensor:
  - platform: senseu
    id: senseu_device
    connected:
      name: SenseU Connected
    data_fresh:
      name: SenseU Data Fresh
    wearing:
      name: SenseU Wearing
    breath:
      name: SenseU Breath Alarm
    posture:
      name: SenseU Posture Alarm
    temperature:
      name: SenseU Temperature Alarm
    battery:
      name: SenseU Battery Alarm
text_sensor:
  - platform: senseu
    id: senseu_device
    posture:
      name: SenseU Posture
    status:
      name: SenseU Status
    charge_status:
      name: SenseU Charge Status
switch:
  - platform: ble_client
    ble_client_id: senseu_ble
    name: SenseU BLE Connection
